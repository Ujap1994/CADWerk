name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub release from this run
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            command: npx electron-builder --mac --publish never
          # One run per architecture, so no combined (double-size) installer is produced.
          - name: windows
            os: windows-latest
            command: npx electron-builder --win --x64 --publish never && npx electron-builder --win --arm64 --publish never
          - name: linux-x64
            os: ubuntu-24.04
            command: npx electron-builder --linux --x64 --publish never
          # The arm64 snap is built with snapcraft (no prebuilt template); a 22.04 host matches the core22 base.
          - name: linux-arm64
            os: ubuntu-22.04-arm
            command: npx electron-builder --linux --arm64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools squashfs-tools flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # snapcraft 8 renamed the "snap" command that electron-builder calls for core22 builds.
          sudo snap install snapcraft --classic --channel=7.x/stable
      - run: npm run build
      - name: Build packages
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SNAPCRAFT_BUILD_ENVIRONMENT: host
      - name: Allow the Chromium sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Smoke-test the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-test-package.mjs
      - name: Smoke-test the packaged app
        if: runner.os != 'Linux'
        run: node scripts/smoke-test-package.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.rpm
            release/*/*.pacman
            release/*/*.snap
            release/*/*.flatpak
            release/*/*.tar.gz
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          node scripts/release-notes.mjs "$VERSION" > notes.md
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease";; esac
          find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pacman' -o -name '*.snap' -o -name '*.flatpak' -o -name '*.tar.gz' \) > files.txt
          gh release create "$TAG" --title "ParaWerk ${VERSION}" --notes-file notes.md $PRERELEASE --target "${GITHUB_SHA}" $(cat files.txt)
