name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run licenses:check

  e2e:
    name: End-to-end tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Allow the Chromium sandbox on Ubuntu 24.04
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run build
      - name: Run end-to-end tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Run end-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  benchmarks:
    name: Benchmarks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Shared CI runners are noisy; only large slowdowns fail the build.
      BENCH_THRESHOLD: '1.75'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run bench:kernel
      - run: npm run bench:solver
      - name: Allow the Chromium sandbox on Ubuntu 24.04
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run build
      - name: Render benchmarks (software rendering on CI, relative numbers only)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run bench:render
        env:
          BENCH_QUICK: '1'
      - name: Render benchmarks (software rendering on CI, relative numbers only)
        if: runner.os != 'Linux'
        run: npm run bench:render
        env:
          BENCH_QUICK: '1'
      - run: npm run bench:compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks-${{ matrix.os }}
          path: bench/results
          retention-days: 90
