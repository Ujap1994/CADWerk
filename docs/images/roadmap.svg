  <text x="28" y="616" font-size="12" fill="#59636E">Scenario A (hobby pace, ~5–8 h/week): durations ≈ ×2–2.5 · Scenario C (full-time): ≈ ×0.65 · v1.0 window in Scenario B: month 15–20 · details in ROADMAP.md</text>
